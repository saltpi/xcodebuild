name: 'Xcode Build'
description: 'Build, archive, and export an Xcode project or workspace with xcodebuild.'
author: 'Dave Johansen'
branding:
  icon: 'tool'
  color: 'blue'

inputs:
  workspace:
    description: 'Path to the Xcode workspace (.xcworkspace). Mutually exclusive with `project`. Required unless `action` is `export`.'
    required: false
  project:
    description: 'Path to the Xcode project (.xcodeproj). Mutually exclusive with `workspace`. Required unless `action` is `export`.'
    required: false
  scheme:
    description: 'Scheme to build.'
    required: true
  configuration:
    description: 'Build configuration (e.g. Debug, Release).'
    required: false
    default: 'Release'
  sdk:
    description: 'SDK to build against (e.g. iphoneos, iphonesimulator, macosx).'
    required: false
  destination:
    description: 'Destination specifier (e.g. "generic/platform=iOS").'
    required: false
  action:
    description: 'xcodebuild action: build, archive, test, build-for-testing, test-without-building, clean, or export. `export` only runs `xcodebuild -exportArchive` on an existing `archive-path`, requires `export-options-plist`, and ignores `workspace`/`project`.'
    required: false
    default: 'build'
  archive-path:
    description: 'Output path for the .xcarchive. Required when `action` is `archive`. When `action` is `export`, the existing .xcarchive to export.'
    required: false
  export-options-plist:
    description: 'Path to an ExportOptions.plist. When provided after an archive, the archive is exported to `export-path`.'
    required: false
  export-path:
    description: 'Directory to export the archive to when `export-options-plist` is provided. Defaults to `<result-bundle-dir>/<scheme>.ipa`.'
    required: false
  derived-data-path:
    description: 'Derived data directory.'
    required: false
    default: '.build/DerivedData'
  result-bundle-path:
    description: 'Path for the .xcresult bundle. Defaults to `.build/Artifacts/<scheme>.xcresult`.'
    required: false
  build-number:
    description: 'Value passed to xcodebuild as CURRENT_PROJECT_VERSION.'
    required: false
  build-settings:
    description: 'Additional xcodebuild build settings as KEY=VALUE pairs, one per line.'
    required: false
  extra-arguments:
    description: 'Additional arguments passed verbatim to xcodebuild (shell-quoted). Also forwarded to -exportArchive unless `export-extra-arguments` is specified.'
    required: false
  export-extra-arguments:
    description: 'Additional arguments passed verbatim to xcodebuild -exportArchive (shell-quoted). Defaults to `extra-arguments` if omitted.'
    required: false
  allow-provisioning-updates:
    description: 'Pass -allowProvisioningUpdates to xcodebuild during build, archive, and export.'
    required: false
    default: 'false'
  allow-provisioning-device-registration:
    description: 'Pass -allowProvisioningDeviceRegistration to xcodebuild during build, archive, and export. Only takes effect if `allow-provisioning-updates` is true.'
    required: false
    default: 'false'
  authentication-key-path:
    description: 'Path to an App Store Connect API authentication key (.p8). Passed as -authenticationKeyPath to xcodebuild.'
    required: false
  authentication-key-id:
    description: 'App Store Connect API key ID. Passed as -authenticationKeyID to xcodebuild.'
    required: false
  authentication-key-issuer-id:
    description: 'App Store Connect API issuer ID. Passed as -authenticationKeyIssuerID to xcodebuild.'
    required: false
  output-formatter:
    description: 'Command to pipe xcodebuild output through (e.g. xcbeautify, xcpretty). Set to an empty string to disable. The default uses xcbeautify''s github-actions renderer so compile errors and warnings surface as inline PR annotations.'
    required: false
    default: 'xcbeautify --renderer github-actions'
  log-path:
    description: 'Path to write the raw xcodebuild log. Defaults to `.build/<scheme>-<action>.log`.'
    required: false
  parallelize-targets:
    description: 'Pass -parallelizeTargets to xcodebuild.'
    required: false
    default: 'true'
  show-build-timing-summary:
    description: 'Pass -showBuildTimingSummary to xcodebuild.'
    required: false
    default: 'true'
  disable-automatic-package-resolution:
    description: 'Pass -disableAutomaticPackageResolution to xcodebuild.'
    required: false
    default: 'true'
  zip-result-bundle:
    description: 'Zip the .xcresult bundle next to itself as <result-bundle-path>.zip after the build.'
    required: false
    default: 'false'
  zip-archive:
    description: 'Zip the .xcarchive next to itself as <archive-path>.zip after archiving.'
    required: false
    default: 'false'
  working-directory:
    description: 'Working directory to run xcodebuild in.'
    required: false

outputs:
  archive-path:
    description: 'Resolved path to the produced .xcarchive, if any.'
  export-path:
    description: 'Resolved directory containing the exported IPA, if any.'
  ipa-path:
    description: 'Path to the first .ipa found inside `export-path`, if any.'
  app-path:
    description: 'Path to the first .app found inside `export-path`, if any (e.g. a Developer ID export).'
  pkg-path:
    description: 'Path to the first .pkg found inside `export-path`, if any (e.g. a Mac App Store export).'
  result-bundle-path:
    description: 'Resolved path to the .xcresult bundle. Not set when `action` is `export`.'
  log-path:
    description: 'Resolved path to the raw xcodebuild log.'

runs:
  using: 'node24'
  main: 'dist/index.js'
